<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minifigure Dashboard</title>
</head>
<body>
    <h1>My Minifigures</h1>
    <ul>
        {% for fig in minifigures %}
        <li>
            {% if fig.image %}
            <img src="{{ url_for('static', filename=fig.image) }}" width="80">
            {% endif %}
            {{ fig.name }} ({{ fig.id }}) - £{{ fig.price }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
